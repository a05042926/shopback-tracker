name: ShopBack 回饋率定時爬蟲

on:
  schedule:
    # 每天台灣時間 09:00 和 21:00 執行（UTC+8，所以是 UTC 01:00 和 13:00）
    - cron: "0 1 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:  # 允許手動觸發

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允許 push 回 repo

    steps:
      - name: 🛎️ Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: 🔍 Run scraper
        run: python scraper/shopback_scraper.py

      - name: 💾 Commit & push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cashback_history.json
          git diff --staged --quiet || git commit -m "📊 auto: update cashback rates $(date +'%Y-%m-%d %H:%M') CST"
          git push
      - name: Run flight scraper
        env: 
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scraper/flight_scraper.py
          
